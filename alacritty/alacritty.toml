[window]
dynamic_padding = true
opacity = 0.95
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 2
y = 2
 
# Colors (Gruvbox dark)

# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
# normal contrast background = = '#282828'
background = '#1d2021'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#1d2021'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#bdae93'

# Bright colors
[colors.bright]
black   = '#a89984'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[env]
TERM = "xterm-256color"

[font]
size = 15.0

normal.family = "IosevkaTerm NFM"
bold.family = "IosevkaTerm NFM"
italic.family = "IosevkaTerm NFM"
bold_italic.family = "IosevkaTerm NFM"

[scrolling]
history = 5000
